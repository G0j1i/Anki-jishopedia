<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="tabs">
        <button class="tab-button" data-tab="general-tab">General</button>
        <button class="tab-button" data-tab="languages-tab">Languages</button>
        <button class="tab-button" data-tab="about-tab">About</button>
    </div>
    <div class="tab-content-container">
        <div id="general-tab" class="tab-content">
            <!-- General settings content -->
        </div>
        <div id="languages-tab" class="tab-content">
            <div class="language-search-container">
                <input type="text" id="language-search" placeholder="Search languages...">
                <div id="selected-languages"></div>
            </div>
        </div>
        <div id="about-tab" class="tab-content">
            <!-- Content will be populated by JavaScript -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
